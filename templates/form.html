<!DOCTYPE html>
<html>
<head>
    <title>Create Resume</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #667eea, #764ba2);">

<div class="container mt-5">
    <div class="card p-4 shadow-lg" 
         style="background: rgba(255,255,255,0.9); border-radius: 15px;">

        <h2 class="text-center mb-4">
            {% if is_edit %}
                Update Resume
            {% else %}
                Create Resume
            {% endif %}
        </h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Profile Image -->
            <div class="mb-3">
                <label>Profile Image</label>
                {{ form.profile_image }}
            </div>

            <!-- Name -->
            <div class="mb-3">
                <label>Name</label>
                {{ form.name }}
            </div>

            <!-- Contact -->
            <div class="mb-3">
                <label>Contact No</label>
                {{ form.contact_no }}
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label>Email</label>
                {{ form.email }}
            </div>

            <!-- Career Objective -->
            <div class="mb-3">
                <label>Career Objective</label>
                {{ form.career_objective }}
            </div>

            <hr>

            <!-- Education -->
            <div class="mb-3">
                <label>Education</label>
                {{ form.education }}
            </div>

            <hr>

            <!-- Technical Skills -->
            <div class="mb-3">
                <label>Technical Skills</label>
                {{ form.t_skills }}
            </div>

            <hr>

            <!-- Soft Skills -->
            <div class="mb-3">
                <label>Soft Skills</label>
                {{ form.s_skills }}
            </div>

            <hr>

            <!-- Projects -->
            <div class="mb-3">
                <label>Projects</label>
                {{ form.projects }}
            </div>

            <hr>

            <!-- Experience -->
            <div class="mb-3">
                <label>Experience</label>
                {{ form.experience }}
            </div>
            <!-- Submit Button -->
            <button type="submit" 
                    class="btn w-100"
                    style="background: #43a0d6; color: white; font-weight: bold;">
                {% if is_edit %} Update Resume {% else %} Save Resume {% endif %}
            </button>

        </form>
    </div>
</div>

</body>
</html>
